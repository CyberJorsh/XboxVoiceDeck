name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ARM64 build and tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Check generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- XboxVoiceDeck.xcodeproj

      - name: Build Release
        run: bash scripts/build.sh Release

      - name: Run XCTest, clock simulations and sanitizers
        run: bash scripts/test.sh

      - name: Run silent software safety diagnostic
        run: bash scripts/safety_check.sh

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-results
          path: build/tests/*.xcresult
          if-no-files-found: warn
          retention-days: 7
